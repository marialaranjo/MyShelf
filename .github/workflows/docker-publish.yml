name: Build and Publish Docker Images

# Corre sempre que houver push para main que toque em self-hosted/, ou
# manualmente via "Run workflow". Filtrado por paths porque o repositório
# também tem a versão standalone e a documentação, que não precisam de
# rebuild de imagens Docker.
on:
  push:
    branches: [main]
    paths:
      - 'self-hosted/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # necessário para publicar no GHCR

    strategy:
      matrix:
        # Apenas os serviços com build próprio.
        # "biblioreads" usa imagem pública (nesaku/biblioreads) — não entra aqui.
        service:
          - name: pocketbase
            context: ./self-hosted/pocketbase
            dockerfile: ./self-hosted/pocketbase/Dockerfile
          - name: nginx
            context: ./self-hosted
            dockerfile: ./self-hosted/nginx/Dockerfile

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tags e labels da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/myshelf-${{ matrix.service.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
